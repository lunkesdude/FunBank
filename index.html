<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunBank - Виртуальный банк</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #f8f9fa;
  --bg-secondary: #ffffff;
  --text-primary: #1a1a1a;
  --text-secondary: #6c757d;
  --border-color: #e9ecef;
  --accent-primary: #6366f1;
  --accent-light: #a5b4fc;
  --green-primary: #10b981;
  --red-primary: #ef4444;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
  --sidebar-width: 260px;
}

body.dark {
  --bg-primary: #111827;
  --bg-secondary: #1f2937;
  --text-primary: #f9fafb;
  --text-secondary: #9ca3af;
  --border-color: #374151;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
}

body.black {
  --bg-primary: #000000;
  --bg-secondary: #0a0a0a;
  --text-primary: #ffffff;
  --text-secondary: #888888;
  --border-color: #222222;
  --shadow-sm: 0 1px 3px rgba(255,255,255,0.05);
  --shadow-md: 0 4px 12px rgba(255,255,255,0.08);
  --shadow-lg: 0 10px 40px rgba(255,255,255,0.12);
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ====== ANIMATIONS ====== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInRight {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.8; }
}

@keyframes slideIntoPocket {
  0% { transform: translateY(-120px) rotate(-5deg); opacity: 0; }
  60% { transform: translateY(5px) rotate(2deg); }
  100% { transform: translateY(0) rotate(0deg); opacity: 1; }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

@keyframes shimmer {
  0% { background-position: -1000px 0; }
  100% { background-position: 1000px 0; }
}

/* ====== AUTH ====== */
#authScreen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
}

.auth-container {
  width: 100%;
  max-width: 420px;
  background: var(--bg-secondary);
  border-radius: 24px;
  padding: 48px 40px;
  box-shadow: var(--shadow-lg);
  animation: fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1);
  border: 1px solid var(--border-color);
}

.auth-logo {
  text-align: center;
  margin-bottom: 40px;
  animation: float 3s ease-in-out infinite;
}

.auth-logo h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-logo p {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 8px;
}

.auth-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  background: var(--bg-primary);
  padding: 4px;
  border-radius: 12px;
}

.auth-tab {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.auth-tab.active {
  background: var(--bg-secondary);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
  transform: scale(1.02);
}

.auth-tab:hover:not(.active) {
  background: rgba(99, 102, 241, 0.1);
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-group label {
  display: block;
  font-weight: 500;
  font-size: 14px;
  margin-bottom: 8px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  color: var(--text-primary);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  transform: translateY(-2px);
}

.form-group textarea {
  resize: vertical;
}

.submit-btn {
  padding: 16px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  margin-top: 8px;
  position: relative;
  overflow: hidden;
}

.submit-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.submit-btn:hover::before {
  width: 300px;
  height: 300px;
}

.submit-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(99,102,241,0.4);
}

.submit-btn:active {
  transform: translateY(-1px);
}

/* ====== SIDEBAR ====== */
#bankApp {
  display: none;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  padding: 24px 0;
  z-index: 1000;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 0 24px 24px;
  border-bottom: 1px solid var(--border-color);
  animation: slideInRight 0.5s cubic-bezier(0.16,1,0.3,1);
}

.sidebar-logo {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.sidebar-user {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  animation: slideInRight 0.6s cubic-bezier(0.16,1,0.3,1);
}

.sidebar-user:hover {
  background: var(--bg-primary);
  transform: translateX(4px);
}

.sidebar-avatar {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
  color: white;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform 0.3s;
}

.sidebar-user:hover .sidebar-avatar {
  transform: scale(1.1) rotate(5deg);
}

.sidebar-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sidebar-user-info h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}

.sidebar-user-info p {
  font-size: 12px;
  color: var(--text-secondary);
}

.sidebar-nav {
  padding: 20px 0;
  flex: 1;
}

.nav-section {
  margin-bottom: 24px;
}

.nav-section-title {
  padding: 0 24px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 14px;
  font-weight: 500;
  position: relative;
}

.nav-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 0;
  background: var(--accent-primary);
  border-radius: 0 3px 3px 0;
  transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-item.active::before {
  height: 60%;
}

.nav-item svg {
  width: 20px;
  height: 20px;
  stroke: var(--text-secondary);
  transition: all 0.3s;
}

.nav-item:hover {
  background: var(--bg-primary);
  color: var(--text-primary);
  transform: translateX(4px);
}

.nav-item:hover svg {
  stroke: var(--accent-primary);
  transform: scale(1.1);
}

.nav-item.active {
  background: var(--bg-primary);
  color: var(--accent-primary);
  font-weight: 600;
}

.nav-item.active svg {
  stroke: var(--accent-primary);
}

.sidebar-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border-color);
}

.sidebar-footer .nav-item {
  color: var(--red-primary);
  padding: 12px 0;
}

.sidebar-footer .nav-item svg {
  stroke: var(--red-primary);
}

.sidebar-footer .nav-item:hover {
  background: rgba(239, 68, 68, 0.1);
}

/* MOBILE */
.sidebar-toggle {
  position: fixed;
  left: 20px;
  top: 20px;
  width: 44px;
  height: 44px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 1100;
  box-shadow: var(--shadow-md);
  transition: all 0.3s;
}

.sidebar-toggle:hover {
  background: var(--accent-primary);
  transform: scale(1.1);
}

.sidebar-toggle:hover svg {
  stroke: white;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  backdrop-filter: blur(4px);
}

.sidebar-overlay.active {
  display: block;
  animation: fadeIn 0.3s;
}

/* ====== MAIN ====== */
.main-content {
  margin-left: var(--sidebar-width);
  padding: 32px;
  min-height: 100vh;
  transition: margin-left 0.3s;
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  padding: 24px 32px;
  background: var(--bg-secondary);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
}

.header-title h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-title p {
  font-size: 14px;
  color: var(--text-secondary);
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.icon-btn {
  width: 44px;
  height: 44px;
  background: var(--bg-primary);
  border: none;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.icon-btn:hover {
  background: var(--accent-primary);
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 8px 16px rgba(99,102,241,0.3);
}

.icon-btn:hover svg {
  stroke: white;
  transform: scale(1.1);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
  stroke: var(--text-primary);
  transition: all 0.3s;
}

.notif-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 18px;
  height: 18px;
  background: var(--red-primary);
  color: white;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  animation: pulse 2s infinite;
}
</style>
</head>
<body>
<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- CUSTOM ALERT -->
<div class="custom-alert-overlay" id="customAlert">
  <div class="custom-alert-box">
    <div class="alert-icon-wrap" id="alertIconWrap">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <div class="alert-title" id="alertTitle">Заголовок</div>
    <div class="alert-msg" id="alertMsg">Сообщение</div>
    <div class="alert-btns" id="alertBtns">
      <button class="alert-btn-ok" id="alertOkBtn">ОК</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Окно</h2>
      <button class="modal-close" onclick="closeModal()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<style>
/* ====== WALLET ====== */
.wallet {
  position: relative;
  width: 280px;
  height: 230px;
  cursor: pointer;
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  transition: transform 0.4s ease;
  margin: 0 auto 40px;
}

.wallet::after {
  content: "Наведите для просмотра баланса";
  position: absolute;
  bottom: -30px;
  font-style: italic;
  color: var(--accent-primary);
  font-size: 13px;
  font-weight: 600;
  text-decoration: underline;
  white-space: nowrap;
  animation: pulse 2s infinite;
}

.wallet-back {
  position: absolute;
  bottom: 0;
  width: 280px;
  height: 200px;
  background: #1e341e;
  border-radius: 22px 22px 60px 60px;
  z-index: 5;
  box-shadow: inset 0 25px 35px rgba(0,0,0,0.4), inset 0 5px 15px rgba(0,0,0,0.5);
}

.wallet .bank-card {
  position: absolute;
  width: 260px;
  height: 140px;
  left: 10px;
  border-radius: 16px;
  padding: 18px;
  color: white;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), 0 -4px 15px rgba(0,0,0,0.1);
  transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
  animation: slideIntoPocket 0.8s cubic-bezier(0.2,0.8,0.2,1) backwards;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
  margin: 0;
}

.wallet .bank-card:hover {
  transform: none;
  box-shadow: none;
}

.card-inner {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.chip {
  width: 32px;
  height: 24px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.card-info .label {
  font-size: 8px;
  opacity: 0.7;
  text-transform: uppercase;
  margin-bottom: 2px;
  display: block;
}

.card-info .value {
  font-size: 10px;
  font-weight: 500;
}

.card-number-wrapper {
  text-align: right;
}

.hidden-stars {
  font-size: 16px;
  letter-spacing: 2px;
}

.card-number {
  display: none;
  font-size: 14px;
  letter-spacing: 1px;
  font-family: monospace;
}

/* Card variants */
.wcard-stripe {
  background: linear-gradient(135deg, #635bff, #a29af7) !important;
  bottom: 90px;
  z-index: 10;
  animation-delay: 0.1s;
}

.wcard-business {
  background: linear-gradient(135deg, #10b981, #34d399) !important;
  bottom: 65px;
  z-index: 20;
  animation-delay: 0.2s;
}

.wcard-gold {
  background: linear-gradient(135deg, #f59e0b, #fbbf24) !important;
  color: #1a1a1a !important;
  bottom: 40px;
  z-index: 30;
  animation-delay: 0.3s;
}

.wcard-gold .chip {
  background: rgba(0,0,0,0.1);
}

.wcard-gold .label {
  color: #8c6d00;
}

.pocket {
  position: absolute;
  bottom: 0;
  width: 280px;
  height: 160px;
  z-index: 40;
  filter: drop-shadow(0 15px 25px rgba(20,40,20,0.4));
}

.pocket-content {
  position: absolute;
  top: 45px;
  width: 100%;
  text-align: center;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.balance-stars {
  color: #839e7b;
  font-size: 24px;
  letter-spacing: 4px;
  transition: 0.3s;
}

.balance-real {
  color: #a7c59e;
  font-size: 22px;
  font-weight: 600;
  opacity: 0;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, 10px);
  transition: 0.3s;
  white-space: nowrap;
}

.eye-icon-wrapper {
  margin-top: 8px;
  height: 20px;
  width: 20px;
  position: relative;
  opacity: 0.3;
  transition: 0.3s;
}

.eye-icon {
  position: absolute;
  top: 0;
  left: 0;
  stroke: #10b981;
  transition: 0.3s;
}

.wallet:hover {
  transform: translateY(-5px);
}

.wallet:hover .eye-icon-wrapper {
  opacity: 1;
}

.wallet:hover .wcard-stripe {
  transform: translateY(-75px) rotate(-3deg);
}

.wallet:hover .wcard-business {
  transform: translateY(-45px) rotate(2deg);
}

.wallet:hover .wcard-gold {
  transform: translateY(-10px);
}

.wallet .bank-card:hover {
  z-index: 100 !important;
}

.wallet:hover .wcard-stripe:hover {
  transform: translateY(-60px) scale(1.05) rotate(0) !important;
}

.wallet:hover .wcard-business:hover {
  transform: translateY(-70px) scale(1.05) rotate(0) !important;
}

.wallet:hover .wcard-gold:hover {
  transform: translateY(-60px) scale(1.05) rotate(0) !important;
}

.wallet .bank-card:hover .hidden-stars {
  display: none;
}

.wallet .bank-card:hover .card-number {
  display: block;
}

.wallet:hover .balance-stars {
  opacity: 0;
}

.wallet:hover .balance-real {
  opacity: 1;
  transform: translate(-50%, 0);
}

.wallet:hover .eye-slash {
  opacity: 0;
  transform: scale(0.5);
}

.wallet:hover .eye-open {
  opacity: 1;
  transform: scale(1.1);
}

/* ====== CARDS PAGE ====== */
.bank-card {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 200px;
  border-radius: 20px;
  padding: 24px;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  margin-bottom: 16px;
  box-shadow: var(--shadow-md);
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
}

.bank-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: var(--shadow-lg);
}

<script type="module">
import { initializeApp } from 
'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { 
  getAuth, createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, 
  onAuthStateChanged, signOut 
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

import { 
  getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, 
  collection, query, orderBy, limit, getDocs, increment, 
  where, addDoc, serverTimestamp 
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

/* ================= FIREBASE ================= */

const firebaseConfig = {
 apiKey: "AIzaSyDMrSrz1xKauScKRzWWAx8nkuMnFrwJ6pg",
 authDomain: "funbank-game.firebaseapp.com",
 projectId: "funbank-game",
 storageBucket: "funbank-game.firebasestorage.app",
 messagingSenderId: "884591565841",
 appId: "1:884591565841:web:af4c6faa36d25a393d65b0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let CU = null;
let UD = null;

/* ================= ROLE SYSTEM ================= */

function getRole(user) {
  if (!user) return 'user';
  if (user.username?.toLowerCase() === 'lunkes') return 'developer';
  if (user.isAdmin) return 'admin';
  return 'user';
}

function isDeveloper() {
  return getRole(UD) === 'developer';
}

function canEditUser(targetUser) {
  if (getRole(targetUser) === 'developer') return false;
  if (isDeveloper()) return true;
  if (getRole(UD) === 'admin' && getRole(targetUser) !== 'admin')
    return true;
  return false;
}

/* ================= THEMES ================= */

window.setTheme = (theme) => {
  document.body.classList.remove('dark','black');
  if (theme === 'dark') document.body.classList.add('dark');
  if (theme === 'black') document.body.classList.add('black');
  localStorage.setItem('theme', theme);
};

window.setAccent = (color) => {
  document.documentElement.style.setProperty('--accent-primary', color.main);
  document.documentElement.style.setProperty('--accent-light', color.light);
  localStorage.setItem('accent', JSON.stringify(color));
};

function initTheme() {
  const t = localStorage.getItem('theme');
  if (t) setTheme(t);
  const a = localStorage.getItem('accent');
  if (a) setAccent(JSON.parse(a));
}

/* ================= AUTH ================= */

window.doRegister = async (e) => {
  e.preventDefault();
  const username = regUser.value.trim().toLowerCase();
  const pass = regPass.value;
  const email = username + "@funbank.app";

  const cred = await createUserWithEmailAndPassword(auth,email,pass);

  await setDoc(doc(db,'users',cred.user.uid),{
    username,
    name: regName.value,
    balance: 1000,
    isAdmin: false,
    businesses: [],
    inventory: [],
    rating: { total:0, count:0 },
    createdAt: Date.now()
  });
};

window.doLogin = async (e)=>{
  e.preventDefault();
  const username = loginUser.value.trim().toLowerCase();
  const pass = loginPass.value;
  const email = username + "@funbank.app";
  await signInWithEmailAndPassword(auth,email,pass);
};

onAuthStateChanged(auth, async(user)=>{
  if(!user) return;
  CU = user;
  const snap = await getDoc(doc(db,'users',user.uid));
  UD = snap.data();
  initTheme();
  renderUser();
  loadShop();
});

/* ================= BUSINESS (5 LIMIT) ================= */

window.createBusiness = async(type)=>{
  if(!UD.businesses) UD.businesses=[];
  if(UD.businesses.length>=5){
    alert("Лимит 5 бизнесов");
    return;
  }
  UD.businesses.push({
    type,
    createdAt: Date.now()
  });
  await updateDoc(doc(db,'users',CU.uid),{
    businesses: UD.businesses
  });
};

/* ================= SHOP SYSTEM ================= */

async function loadShop(){
  const snap = await getDocs(collection(db,'shopItems'));
  let html='';
  snap.forEach(d=>{
    const item=d.data();
    if(item.status!=='approved') return;
    html+=`
      <div class="shop-item">
        <div class="shop-item-header">
          <div>
            <h4>${item.name}</h4>
            <div class="shop-item-seller">@${item.seller}</div>
          </div>
          <div class="shop-item-price">${item.price} FB</div>
        </div>
        <div class="shop-item-desc">${item.description}</div>
        <button class="btn" onclick="buyItem('${d.id}')">Купить</button>
      </div>
    `;
  });
  const el=document.getElementById('shopWrap');
  if(el) el.innerHTML=html;
}

window.buyItem = async(id)=>{
  const ref=doc(db,'shopItems',id);
  const snap=await getDoc(ref);
  const item=snap.data();
  if(UD.balance<item.price) return alert("Недостаточно средств");

  UD.balance-=item.price;
  UD.inventory.push(item);

  await updateDoc(doc(db,'users',CU.uid),{
    balance: UD.balance,
    inventory: UD.inventory
  });

  alert("Куплено!");
};

/* ================= DEVELOPER MODERATION ================= */

window.approveItem = async(id)=>{
  if(!isDeveloper()) return;
  await updateDoc(doc(db,'shopItems',id),{status:'approved'});
};

window.rejectItem = async(id)=>{
  if(!isDeveloper()) return;
  await updateDoc(doc(db,'shopItems',id),{status:'rejected'});
};

/* ================= INVENTORY ================= */

window.renderInventory = ()=>{
  let html='';
  (UD.inventory||[]).forEach((item,i)=>{
    html+=`
      <div class="inventory-item">
        <div class="inventory-item-name">${item.name}</div>
        <div class="inventory-item-actions">
          <button class="btn btn-success" onclick="setProfileItem(${i})">В профиль</button>
          <button class="btn btn-danger" onclick="sellItem(${i})">Продать</button>
        </div>
      </div>
    `;
  });
  document.getElementById('inventoryWrap').innerHTML=html;
};

window.sellItem = async(i)=>{
  const item=UD.inventory[i];
  UD.balance+=item.price;
  UD.inventory.splice(i,1);
  await updateDoc(doc(db,'users',CU.uid),{
    balance:UD.balance,
    inventory:UD.inventory
  });
  renderInventory();
};

window.setProfileItem = async(i)=>{
  const item=UD.inventory[i];
  await updateDoc(doc(db,'users',CU.uid),{
    profileItem:item
  });
};

/* ================= RATING SYSTEM ================= */

window.rateUser = async(targetId,value)=>{
  const ref=doc(db,'users',targetId);
  const snap=await getDoc(ref);
  const u=snap.data();
  const newTotal=(u.rating?.total||0)+value;
  const newCount=(u.rating?.count||0)+1;
  await updateDoc(ref,{
    rating:{ total:newTotal,count:newCount }
  });
};

/* ================= VIEW PROFILE ================= */

window.viewProfile = async(uid)=>{
  const snap=await getDoc(doc(db,'users',uid));
  const u=snap.data();
  alert("Профиль @"+u.username+
        "\nБаланс: "+u.balance+
        "\nРейтинг: "+
        (u.rating?.count?
          (u.rating.total/u.rating.count).toFixed(1):"0"));
};

/* ================= RENDER ================= */

function renderUser(){
  document.getElementById('sidebarUsername').textContent='@'+UD.username;
  document.getElementById('walletBalance').textContent=UD.balance;
}

console.log("FunBank v3.0 Loaded 🚀");
